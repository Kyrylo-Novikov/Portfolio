<section>
  <div class="content-hero">
    <div class="title-box">
      <h2>Frontend Developer</h2>
      <div>
        <h1>Kyrylo Novikov</h1>
        <div class="btn-container">
          <a href="#portfolio-section" class="btn"
            ><span>Check my work</span></a
          >
          <a href="#contact-section" class="btn"><span>Contact me</span></a>
        </div>
      </div>
    </div>
    <div class="side-left">
      <div class="scroll">
        <a href="#about-me-section"
          ><img src="/assets/imgs/icon-interactiv/arrow.png" alt=""
        /></a>
      </div>
      <div class="separator"></div>
    </div>
    <div class="side-right">
      <div class="email">
        @if (screen.isMobile) {<a href="mailto:kyrylonovikov@gmail.com">
          <img
            class="mobile-mail-icon"
            src="assets/imgs/icon-interactiv/mail.svg"
            alt="writte me a mail"
        /></a>
        } @else {
        <a href="mailto:kyrylonovikov@gmail.com">kyrylonovikov&#64;gmail.com</a
        >}
      </div>

      <div class="social-icon">
        <div
          class="git-icons"
          (mouseover)="isGitHoverd = true"
          (mouseleave)="isGitHoverd = false"
        >
          <a href="https://github.com/Kyrylo-Novikov"
            ><img
              class="base"
              [style.opacity]="!isGitHoverd ? 1 : 0"
              src="/assets/imgs/icon-interactiv/git-icon.png"
              alt=""
            />
            <img
              class="hover"
              src="/assets/imgs/icon-interactiv/git-icon-hover.png"
              alt=""
              [style.opacity]="isGitHoverd ? 1 : 0"
            />
          </a>
        </div>
        <div
          class="in-icons"
          (mouseover)="isInHoverd = true"
          (mouseleave)="isInHoverd = false"
        >
          <a href="https://www.linkedin.com/in/kyrylo-novikov-831808368">
            <img
              class="base"
              [style.opacity]="!isInHoverd ? 1 : 0"
              src="/assets/imgs/icon-interactiv/in-icon.png"
              alt=""
            />
            <img
              class="hover"
              src="/assets/imgs/icon-interactiv/in-icon-hover.png"
              alt=""
              [style.opacity]="isInHoverd ? 1 : 0"
            />
          </a>
        </div>
      </div>
      <div class="separator"></div>
    </div>

    <div class="marquee-wrapper">
      <div class="marquee">
        <div class="marquee-content">
          @for (item of marqueenLoop; track $index) {
          <span>{{ item }}</span
          ><span> &#183; </span> }
        </div>
      </div>
    </div>
  </div>
</section>
