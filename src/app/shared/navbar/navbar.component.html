<nav>
  <div class="language-switch">
    <input type="radio" name="language" id="eng-radio" />
    <label for="eng-radio">EN</label>
    <input type="radio" checked name="language" id="deu-radio" />
    <label for="deu-radio">DE</label>
  </div>
  <div class="header-links">
    <a
      [routerLink]="['/']"
      [fragment]="'about-me-section'"
      [class.aktiv]="aktivSection === 'about-me'"
      (click)="setAktiv('about-me')"
      >About me</a
    >
    <a
      [routerLink]="['/']"
      [class.aktiv]="aktivSection === 'skills'"
      (click)="setAktiv('skills')"
      [fragment]="'skill-section'"
      >Skills</a
    >
    <a
      [routerLink]="['/']"
      [class.aktiv]="aktivSection === 'projects'"
      (click)="setAktiv('projects')"
      [fragment]="'portfolio-section'"
      >Projects</a
    >
  </div>
</nav>
