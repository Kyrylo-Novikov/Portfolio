<header>
  <div class="header-left">
    <app-navbar
      [isActive]="checkedCurrentLang.bind(this)"
      (langChange)="changeLanguage($event)"
    ></app-navbar>
    <app-nav-mobile
      [isActive]="checkedCurrentLang.bind(this)"
      (langChange)="changeLanguage($event)"
    ></app-nav-mobile>
  </div>
  <div class="header-right">
    <app-letter-name [hideNameOnMobile]="true"></app-letter-name>
  </div>
</header>
